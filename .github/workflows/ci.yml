# WARNING: branch protection on `main` requires the exact status-check context
# "CI / test", which GitHub derives from this file's `name:` plus the job name
# (`test`). Renaming either silently strands PRs: the required check stays in
# "Expected" state and the merge API rejects with 405 even when the run is
# green. Change the protection rule's contexts in the same change. Note that
# Actions check-runs alone do NOT satisfy this rule — a legacy commit status
# named exactly "CI / test" must also exist on the head SHA. The final step of
# this workflow posts that status automatically (proven 2026-09-29, PR #6);
# do not remove it — without it every PR needs a manual shim before merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The status-posting step below needs write access to commit statuses.
permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Both harnesses launch Chrome via CHROME_PATH (playwright-core, no bundled
      # browsers). Ubuntu runners ship Google Chrome at /usr/bin/google-chrome.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Full regression: 11 unit suites + the two real-Chrome harnesses
      # (breast 15-step presenter path, non-TNM myeloma path).
      - run: npm test

      - name: Upload browser-harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test/browser-evidence*/
          if-no-files-found: ignore

      # The gate quirk (see file top): classic branch protection requires a
      # legacy commit status named exactly "CI / test", but Actions only
      # creates a check-run. Post that status ourselves via /statuses/<sha>
      # so merging is automatic. On pull_request events, github.sha is the
      # merge-ref commit — the status must go on the PR HEAD sha.
      - name: Post "CI / test" commit status (branch-protection gate)
        if: always()
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE_IN: ${{ job.status }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$STATE_IN" in
            success)   STATE=success ;;
            cancelled) STATE=error ;;
            *)         STATE=failure ;;
          esac
          HTTP=$(curl -s -o /tmp/status-resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"state\":\"$STATE\",\"context\":\"CI / test\",\"description\":\"Actions run ${GITHUB_RUN_ID}: ${STATE_IN}\",\"target_url\":\"$RUN_URL\"}")
          echo "POST /repos/$REPO/statuses/$SHA state=$STATE → HTTP $HTTP"
          cat /tmp/status-resp.json
          [ "$HTTP" = "201" ] || { echo "::error::status POST failed — the merge gate will need a manual shim"; exit 1; }
